# Temporary: proves the .gitlab-ci.yml change works inside the very image the
# buildbot job uses. Lives on this branch only, never on the one that is
# proposed upstream.
name: Preflight keyserver fix

on:
  push:
  workflow_dispatch:

jobs:
  gitlab-ci-parses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('.gitlab-ci.yml'))
          steps = d['libretro-build-linux-x64']['before_script']
          for s in steps:
              print(repr(s))
          assert any('keyserver.ubuntu.com/pks/lookup' in s for s in steps)
          assert not any('apt-key' in s for s in steps)
          PY

  key-fetch-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The buildbot's own registry is not reachable from here ("Get
      # https://git.libretro.com:5050/v2/: context deadline exceeded"), so this
      # runs against the image's base instead - libretro-build-amd64-ubuntu is
      # FROM ubuntu:bionic, and installs curl, sudo and gnupg, which is all the
      # changed line needs.
      - name: Fetch the key and let apt use it
        run: |
          docker run --rm ubuntu:bionic bash -c '
            set -eux
            apt-get update -qy
            apt-get install -qy curl gnupg ca-certificates > /dev/null

            # The line from .gitlab-ci.yml, minus the sudo the buildbot needs.
            curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x16FAAD7AF99A65E2" \
              | gpg --dearmor -o /etc/apt/trusted.gpg.d/ubuntu-toolchain-r.gpg

            # bionic ships gpg 2.2.4, which has no --show-keys; apt-key can still
            # read a keyring, and the real proof is the apt run below anyway.
            apt-key --keyring /etc/apt/trusted.gpg.d/ubuntu-toolchain-r.gpg list 2>/dev/null | head -5
            echo "deb https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu bionic main" \
              > /etc/apt/sources.list.d/toolchain.list
            apt-get update -qy 2>&1 | tee /tmp/update.log
            ! grep -i "NO_PUBKEY\|not signed\|GPG error" /tmp/update.log
            apt-cache policy gcc-11 | head -3
          '
