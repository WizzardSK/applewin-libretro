# Temporary: proves the .gitlab-ci.yml change works inside the very image the
# buildbot job uses. Lives on this branch only, never on the one that is
# proposed upstream.
name: Preflight keyserver fix

on:
  push:
  workflow_dispatch:

jobs:
  gitlab-ci-parses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import yaml
          d = yaml.safe_load(open('.gitlab-ci.yml'))
          steps = d['libretro-build-linux-x64']['before_script']
          for s in steps:
              print(repr(s))
          assert any('keyserver.ubuntu.com/pks/lookup' in s for s in steps)
          assert not any('apt-key' in s for s in steps)
          PY

  same-key-either-way:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The buildbot's registry is not reachable from here ("Get
      # https://git.libretro.com:5050/v2/: context deadline exceeded"), so this
      # runs on the image's base - libretro-build-amd64-ubuntu is FROM
      # ubuntu:bionic and installs curl, sudo and gnupg, which is all the
      # changed line needs.
      #
      # What it proves is the claim the change actually makes: the key that
      # arrives over HTTPS is the same key apt-key would have fetched from the
      # keyserver, and apt can read the keyring it lands in. It deliberately
      # does not assert anything about apt.kitware.com's current signature -
      # that repository is signed by 65ADECD7A7039392 today, which is a
      # separate question from how this one key gets fetched.
      - name: curl and apt-key fetch the same key
        run: |
          docker run --rm ubuntu:bionic bash -c '
            set -eux
            apt-get update -qy
            apt-get install -qy curl gnupg ca-certificates > /dev/null

            # The new line, minus the sudo the buildbot needs.
            curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x16FAAD7AF99A65E2" \
              | gpg --dearmor -o /etc/apt/trusted.gpg.d/kitware-archive.gpg
            apt-key --keyring /etc/apt/trusted.gpg.d/kitware-archive.gpg \
              adv --fingerprint --with-colons 2>/dev/null | grep ^fpr: | head -1 > /tmp/https.fpr

            # The old one, into a keyring of its own.
            apt-key --keyring /tmp/keyserver.gpg adv \
              --keyserver keyserver.ubuntu.com --recv-keys 16FAAD7AF99A65E2
            apt-key --keyring /tmp/keyserver.gpg adv --fingerprint --with-colons 2>/dev/null \
              | grep ^fpr: | head -1 > /tmp/keyserver.fpr

            cat /tmp/https.fpr /tmp/keyserver.fpr
            diff /tmp/https.fpr /tmp/keyserver.fpr

            # And apt reads the keyring rather than complaining about it.
            apt-get update -qy 2>&1 | tee /tmp/update.log
            if grep -i "invalid keyring\|could not be read\|Error reading" /tmp/update.log; then
              echo "apt could not read the keyring"
              exit 1
            fi
          '
